# Secrets/overrides not committed to source control (e.g. Slack webhook URLs),
# sourced after this file every time it is sourced. Ignored by git; the CI
# pipeline populates it from the OUTRIDER_CONFIG variable (see .gitlab-ci.yml).
LOCAL_CONF="$(dirname "${BASH_SOURCE[0]}")/local.conf"
if [[ -f "$LOCAL_CONF" ]]; then
    # shellcheck source=/dev/null
    source "$LOCAL_CONF"
fi
